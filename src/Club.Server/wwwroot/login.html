<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Club Manager — вхід</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #f5f5f4; color: #1c1917; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 28px; border-radius: 10px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #57534e; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 15px; }
  button { margin-top: 20px; width: 100%; padding: 9px; font-size: 15px; cursor: pointer; }
  #error { color: #b91c1c; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<form id="form">
  <h1>Club Manager</h1>
  <label for="login">Логін</label>
  <input id="login" autocomplete="username" autofocus>
  <label for="password">Пароль</label>
  <input id="password" type="password" autocomplete="current-password">
  <button type="submit">Увійти</button>
  <div id="error"></div>
</form>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const error = document.getElementById('error');
  error.textContent = '';
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      login: document.getElementById('login').value,
      password: document.getElementById('password').value
    })
  });
  if (r.ok) { location.href = '/'; return; }
  try { error.textContent = (await r.json()).error; } catch { error.textContent = 'Помилка входу'; }
});
</script>
</body>
</html>
